<!DOCTYPE html>
<html>
<head>
<title>AccessFlow - Eye Tracking</title>
<link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-bar">
                <div class="toggle-switch" id="toggleSwitch">
                    <span class="slider"></span>
                </div>
                <h2>AccessFlow - Eye Tracking</h2>
            </div>
        </div>
        <div class="gestures">
            <h3>Gestures</h3>
            <div class="gesture-row">
                <div class="left-gesture">
                    <label>Scroll Left</label>
                    <select>
                        <option value="">Choose an action</option>
                        <option value="pageLeft">Look Left</option>
                        <option value="contentLeft">Fixate on Left Edge</option>
                        <option value="windowLeft">Look Up + Look Left</option>
                    </select>
                </div>
                <div class="right-gesture">
                    <label>Scroll Right</label>
                    <select>
                        <option value="">Choose an action</option>
                        <option value="pageRight">Look Right</option>
                        <option value="contentRight">Fixate on Right Edge</option>
                        <option value="windowRight">Look Up + Look Right</option>
                    </select>
                </div>
            </div>
            <div class="gesture-row">
                <div class="left-gesture">
                    <label>Scroll Down</label>
                    <select>
                        <option value="">Choose an action</option>
                        <option value="pageDown">Look Down</option>
                        <option value="contentDown">Fixate on Bottom Edge</option>
                        <option value="windowDown">Look Down + Look Left</option>
                        <option value="windowDown">Look Down + Hold Gaze</option>
                    </select>
                </div>
                <div class="right-gesture">
                    <label>Scroll Up</label>
                    <select>
                        <option value="">Choose an action</option>
                        <option value="pageDown">Look Up</option>
                        <option value="contentDown">Fixate on top Edge</option>
                        <option value="windowDown">Look Up + Look Left</option>
                        <option value="windowDown">Look Up + Hold Gaze</option>
                    </select>
                </div>
            </div>
            <div class="gesture-row">
                <div class="left-gesture">
                    <label>Trigger or choose</label>
                    <select>
                        <option value="">Choose an action</option>
                        <option value="pageDown">Fixate for 3 seconds</option>
                        <option value="pageDown">Fixate for 5 seconds</option>
                        <option value="pageDown">Fixate for 7 seconds</option>
                        <option value="pageDown">Fixate for 10 seconds</option>
                    </select>
                </div>
            </div>

            <br>
            <br>
            <br>
            <br>


            <div class="customise-container"> 
                <div class="customise">
                    <h3>Customise</h3>
                    <div class="customise-row">
                        <div class="action-row">
                            <label>Action</label>
                            <select>
                                <option value="">Select Item</option>
                                <option value="option1">Option 1</option>
                                <option value="option2">Option 2</option>
                                <option value="option3">Option 3</option>
                            </select>
                        </div>
                        <div class="gesture-row">
                            <label>Gesture</label>
                            <select>
                                <option value="">Select Item</option>
                                <option value="optionA">Option A</option>
                                <option value="optionB">Option B</option>
                                <option value="optionC">Option C</option>
                            </select>
                        </div>
                    </div>
                    <button id="addButton">Add</button>
                </div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; height: 10vh;">
                <button id="saveButton">Save</button>
            </div> 
    </div>
    <script src="/frontend/popup.js"></script> 
</body>
</html>
