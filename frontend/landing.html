<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eye Tracker Landing</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
  margin: 0;
  padding: 20px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f5f7fa;
  color: #333;
  width: 320px;
  height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center; 

  /* Add some padding inside the box */
  box-sizing: border-box;
}

/* add max-width to text to avoid stretching */
h1, p {
  max-width: 280px;
  text-align: center;
}
    button {
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 8px rgb(74 144 226 / 0.4);
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
      width: 100%;
      max-width: 280px;
    }

    button:hover {
      background-color: #357ABD;
      box-shadow: 0 6px 12px rgb(53 122 189 / 0.6);
    }

    button:active {
      background-color: #2a5d8f;
    }

    /* Responsive for small popup */
    @media (max-width: 320px) {
      body {
        width: 280px;
        height: 220px;
        padding: 16px;
      }

      h1 {
        font-size: 1.4rem;
      }

      button {
        font-size: 1rem;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to AccessFlow</h1>
  <p>Hands-free web navigation using your eyes. Click below to open the full interface.</p>
  <button id="openFullPopup">Open Fullscreen UI</button>

  <script src="landing.js"></script>
</body>
</html>
